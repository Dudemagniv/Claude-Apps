<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Order — game and mod tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ground:#132018;
    --surface:#221A2C;
    --raise:#2B2138;
    --line:#3A2E4A;
    --ink:#EDE6F2;
    --muted:#9B90AC;
    --brass:#D8A94B;
    --flag:#E8556D;
    --live:#5BC2A8;
    --display:'Syne','Trebuchet MS',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--body);
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding:22px 14px 80px;
  }
  .wrap{max-width:760px;margin:0 auto}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;
     font-size:clamp(26px,6.5vw,38px);margin:0 0 6px;line-height:1.05}
  h2{font-family:var(--display);font-weight:600;font-size:13px;
     letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
     margin:26px 0 10px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--brass);margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;margin:0}

  input[type=text],textarea,select{
    width:100%;font:inherit;font-size:14px;color:var(--ink);
    background:var(--ground);border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;
  }
  textarea{resize:vertical;min-height:56px}
  input::placeholder,textarea::placeholder{color:#6E6480}
  .btn{
    font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.03em;
    background:var(--brass);color:#1A1320;border:0;border-radius:8px;
    padding:9px 16px;cursor:pointer;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--muted);filter:none}
  .btn.red{background:var(--flag);color:#1A1320}
  .btn.small{font-size:12px;padding:6px 12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .pad{padding:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:150px}
  .stack{display:flex;flex-direction:column;gap:8px}
  .hint{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .hint b{color:var(--brass);font-weight:500}

  /* ---------- poster shelf ---------- */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .game{
    position:relative;padding:0;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;cursor:pointer;background:var(--surface);color:var(--ink);
    aspect-ratio:2/3;display:block;text-align:left;
    transition:border-color .15s ease,transform .15s ease;
  }
  .game:hover{border-color:var(--brass);transform:translateY(-3px)}
  .game img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;
    color:rgba(255,255,255,.9);text-shadow:0 2px 12px rgba(0,0,0,.4);padding:10px;text-align:center;
  }
  .veil{
    position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;
    background:linear-gradient(transparent,rgba(12,8,17,.92) 55%);
  }
  .veil .name{font-family:var(--display);font-weight:600;font-size:13px;line-height:1.2;
    display:block;margin-bottom:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .veil .stats{font-family:var(--mono);font-size:10px;color:#C9BFD6;display:flex;gap:8px;flex-wrap:wrap}
  .veil .stats .warn{color:#FF8D9E}
  .veil .stats .lo{color:#7FD8C3}

  /* ---------- game header ---------- */
  .ghead{display:flex;gap:14px;align-items:flex-start;margin-bottom:4px}
  .ghead .art{flex:none;width:84px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
    border:1px solid var(--line);position:relative;background:var(--surface)}
  .ghead .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ghead .art .fallback{font-size:26px}
  .ghead .txt{flex:1;min-width:0}

  /* ---------- loadout tabs ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .tab{
    flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:99px;padding:6px 13px;cursor:pointer;white-space:nowrap;
    transition:all .15s ease;
  }
  .tab:hover{color:var(--ink);border-color:var(--muted)}
  .tab.on{background:var(--live);border-color:var(--live);color:#10201C;font-weight:500}
  .tab.new{border-style:dashed}

  /* ---------- load order rail ---------- */
  .rail{position:relative;padding-left:38px}
  .rail::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .mod{position:relative;margin-bottom:10px;display:flex;gap:10px;
       align-items:center;flex-wrap:wrap}
  .node{position:absolute;left:-38px;top:12px;width:32px;
    font-family:var(--mono);font-size:12px;color:var(--brass);text-align:center}
  .node span{display:inline-block;background:var(--ground);border:2px solid var(--line);
    border-radius:50%;width:26px;height:26px;line-height:22px}
  .mod.flagged .node span{border-color:var(--flag);color:var(--flag)}
  .mod.off .node span{opacity:.35}
  .modcard{flex:1 1 220px;min-width:0;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;transition:opacity .15s ease,border-color .15s ease}
  .mod.flagged .modcard{border-color:rgba(232,85,109,.5)}
  .mod.off .modcard{opacity:.4}
  .modtop{display:flex;gap:10px;align-items:flex-start}
  .modname{flex:1;min-width:0;font-weight:500;word-wrap:break-word}
  .ver{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;
       background:var(--raise);border-radius:5px;padding:2px 6px}
  .src{font-family:var(--mono);font-size:12px;color:var(--brass);text-decoration:none;word-break:break-all}
  .src:hover{text-decoration:underline}
  .modnotes{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);white-space:pre-wrap}
  .mod.flagged .modnotes{color:#F0A5B3}
  .modmeta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .tools{display:flex;gap:8px;align-items:center;flex:0 0 auto;margin-left:auto}

  /* each control floats on its own, clear of the card */
  .icon{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:46px;height:46px;padding:0 12px;
    background:var(--surface);border:1px solid var(--line);border-radius:9px;
    color:var(--muted);cursor:pointer;font-size:18px;line-height:1;
    box-shadow:0 3px 10px -6px #000;
    transition:color .15s ease,background .15s ease,border-color .15s ease,
               box-shadow .15s ease,transform .15s ease;
  }
  .icon:hover{
    color:var(--brass);border-color:var(--brass);
    background:rgba(216,169,75,.12);transform:translateY(-1px);
    box-shadow:0 0 16px -2px rgba(216,169,75,.6);
  }
  .icon:disabled{opacity:.22;cursor:default}
  .icon:disabled:hover{background:var(--surface);color:var(--muted);
    border-color:var(--line);box-shadow:0 3px 10px -6px #000;transform:none}
  .icon.on{color:var(--flag);border-color:rgba(232,85,109,.45)}

  .grip{
    flex:none;background:transparent;border:0;color:var(--muted);
    cursor:grab;font-size:19px;letter-spacing:-2px;line-height:1;
    padding:2px 4px 2px 0;margin-top:1px;touch-action:none;
    border-radius:4px;transition:color .15s ease,background .15s ease;
  }
  .grip:hover{color:var(--brass);background:rgba(216,169,75,.12)}
  .grip:active{cursor:grabbing}
  .mod.lifting{z-index:5;pointer-events:none}
  .mod.lifting .modcard{border-color:var(--brass);
    box-shadow:0 16px 34px -14px #000, 0 0 24px -8px rgba(216,169,75,.65)}
  .mod.lifting .icon.grip{color:var(--brass);border-color:var(--brass)}
  .slot{border:1px dashed var(--brass);border-radius:10px;opacity:.45;margin-bottom:10px}
  body.reordering{user-select:none;-webkit-user-select:none;cursor:grabbing}


  /* selecting several at once */
  .pick{
    flex:none;width:20px;height:20px;border-radius:5px;cursor:pointer;margin-top:1px;
    border:1.5px solid var(--muted);background:transparent;position:relative;
  }
  .pick.on{background:var(--brass);border-color:var(--brass)}
  .pick.on::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #1A1320;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .mod.picked .modcard{border-color:var(--brass);
    box-shadow:inset 0 0 0 1px rgba(216,169,75,.35)}

  .bulkbar{position:sticky;bottom:10px;z-index:20;margin:14px 0 4px}
  .bulkbar .inner{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--raise);border:1px solid var(--brass);border-radius:12px;
    padding:10px 12px;box-shadow:0 14px 30px -14px #000;
  }
  .bulkbar .inner.confirming{border-color:var(--flag)}
  .bulkbar .count{font-family:var(--display);font-size:14px;color:var(--brass);
    letter-spacing:.02em;margin-right:2px}
  .bulkbar input[type=text]{font-size:14px;padding:7px 9px}
  .linklist{margin-top:8px;max-height:220px;overflow-y:auto;display:flex;
    flex-direction:column;gap:4px}
  .linkrow{display:flex;gap:8px;align-items:center;text-decoration:none;
    padding:7px 9px;border-radius:7px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);font-size:13px}
  .linkrow:hover{border-color:var(--brass);color:var(--brass)}
  .linkrow .lname{flex:1;min-width:0;overflow-wrap:anywhere}
  .linkrow .ltag{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}

  /* link out to Nexus */
  .icon.nx{
    text-decoration:none;font-family:var(--display);font-weight:700;
    font-size:15px;letter-spacing:.02em;
  }
  .icon.nx:hover{color:var(--brass)}
  .icon.nx.off{opacity:.55}
  .icon.dl{text-decoration:none;font-size:17px}
  .icon.dl:hover{color:var(--live);border-color:var(--live);
    background:rgba(91,194,168,.12);box-shadow:0 0 16px -2px rgba(91,194,168,.55)}

  .incl{flex:none;width:20px;height:20px;border-radius:5px;cursor:pointer;
    border:1.5px solid var(--muted);background:transparent;position:relative;margin-top:1px}
  .incl.on{background:var(--live);border-color:var(--live)}
  .incl.on::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #10201C;border-width:0 2px 2px 0;transform:rotate(45deg)}

  /* ---------- confirm strip ---------- */
  .confirm{
    background:var(--surface);border:1px solid var(--flag);border-radius:10px;
    padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .confirm .q{flex:1;min-width:180px;font-size:14px}
  .confirm .q b{font-weight:600}
  .confirm .q small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

  .empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;
         text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;font-family:var(--display);color:var(--ink);font-size:16px;margin-bottom:4px}
  .back{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:12px;
        letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:14px}
  .back:hover{color:var(--brass)}
  .foot{margin-top:30px;text-align:center;font-size:12px;color:var(--muted)}
  .foot button{background:none;border:0;color:var(--muted);text-decoration:underline;
    cursor:pointer;font:inherit;padding:0 4px}
  .foot button:hover{color:var(--brass)}
  .notice{background:var(--surface);border:1px solid var(--brass);color:var(--brass);
        border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .warn{background:var(--surface);border:1px solid var(--flag);color:#F0A5B3;
        border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  @media (max-width:520px){
    .tools{margin-left:0;width:100%;justify-content:flex-end}
    .modcard{flex:1 1 100%}
  }
  @media (max-width:430px){
    .rail{padding-left:32px}
    .rail::before{left:12px}
    .node{left:-32px;width:26px}
    .node span{width:24px;height:24px;line-height:20px;font-size:11px}
    .shelf{grid-template-columns:repeat(2,1fr);gap:10px}
  }

  /* --- added since: illuminated first letter, footer mark --- */
  .drop{font-family:var(--display);font-weight:800;color:var(--brass)}
  .fleuron{color:var(--brass);opacity:.5;margin:0 8px}

  /* --- added since: dropping archives in --- */
  .dropveil{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;padding:32px;
    background:rgba(10,7,14,.84);backdrop-filter:blur(2px);
  }
  body.dragging .dropveil{display:flex}
  .dropveil .panel{
    border:2px dashed var(--brass);border-radius:12px;padding:38px 28px;
    text-align:center;max-width:420px;background:var(--surface);
    box-shadow:0 0 60px -20px rgba(216,169,75,.55);
  }
  .dropveil .panel b{display:block;font-family:var(--display);font-size:20px;
    color:var(--brass);margin-bottom:8px}
  .dropveil .panel span{color:var(--ink);font-size:14px}

  .stagerow{display:flex;gap:10px;align-items:center;padding:7px 0;
    border-bottom:1px solid var(--line);cursor:pointer}
  .stagerow:last-of-type{border-bottom:0}
  .stagerow input{flex:none;width:17px;height:17px;accent-color:var(--brass);cursor:pointer}
  .stagerow .sname{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
  .stagerow.skip .sname{color:var(--muted);text-decoration:line-through}
  .stagerow .dupe{font-size:11px;color:var(--flag);white-space:nowrap}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="modFiles" multiple hidden>
<div class="dropveil" id="dropveil"><div class="panel">
  <b>Drop your mod archives</b>
  <span>Names and versions get read straight off the filenames. Nothing is uploaded anywhere.</span>
</div></div>
<datalist id="titles"></datalist>

const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const INDEX = (() => {
  const m = new Map();
  CATALOG.forEach(([t,id,aliases]) => {
    const e = { title:t, appid:id };
    m.set(norm(t), e);
    aliases.forEach(a => { if (!m.has(norm(a))) m.set(norm(a), e); });
  });
  return m;
})();

/* Turn "bg3" into Baldur's Gate 3. Falls back to what was typed. */
function resolveGame(input){
  const n = norm(input);
  if (!n) return null;
  if (INDEX.has(n)) return INDEX.get(n);
  if (n.length >= 3){
    const starts = CATALOG.find(([t]) => norm(t).startsWith(n));
    if (starts) return { title:starts[0], appid:starts[1] };
    const inside = CATALOG.find(([t]) => norm(t).includes(n));
    if (inside) return { title:inside[0], appid:inside[1] };
  }
  return null;
}

    'https://cdn.cloudflare.steamstatic.com/steam/apps/' + appid + '/library_600x900.jpg',

const PIGMENTS = [
  ['#7A4A1E','#2A1710'], ['#8C3A24','#2E110A'], ['#3F5F42','#15220F'],
  ['#2E4468','#101A2C'], ['#6B4326','#241308'], ['#4C3560','#180F22']

function initials(title){
  const words = String(title).replace(/[^\w\s]/g,' ').split(/\s+/).filter(Boolean);
  if (!words.length) return '??';
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return words.slice(0,3).map(w => w[0]).join('').toUpperCase();
}
function hueOf(title){ let h = 0; for (const c of String(title)) h = (h * 31 + c.charCodeAt(0)) % 997; return h; }
function coverHTML(g, cls){
  const urls = g.poster ? [g.poster, ...artChain(g.appid)] : artChain(g.appid);
  const p = PIGMENTS[hueOf(g.title) % PIGMENTS.length];
  const fb = '<span class="fallback" style="background:linear-gradient(150deg,' +
    p[0] + ',' + p[1] + ')">' + esc(initials(g.title)) + '</span>';
  if (!urls.length) return fb;
  return fb + '<img class="' + (cls||'') + '" alt="" src="' + esc(urls[0]) +
    '" data-chain="' + esc(JSON.stringify(urls)) + '" data-step="0">';
}

/* An illuminated capital for the opening letter, as a scribe would. */
function dropCap(title){
  const s = String(title || '');
  const i = s.search(/[A-Za-z0-9]/);

  return esc(s.slice(0, i)) + '<span class="drop">' + esc(s[i]) + '</span>' + esc(s.slice(i + 1));
}

function nexusIdFrom(url){
  const hit = String(url || '').match(/nexusmods\.com\/(?:games\/)?[a-z0-9]+\/mods\/(\d+)/i);
  return hit ? hit[1] : '';
}
const nexusKey = s => String(s||'').toLowerCase().replace(/['\u2019]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function nexusDomain(g){
  if (!g) return '';
  if (g.nexus) return g.nexus.trim();
  return NEXUS[nexusKey(g.title)] || '';
}
/* The Files tab, where the manual download buttons live. Needs the mod id. */
function nexusFilesURL(g, m){
  const d = nexusDomain(g);
  if (!d || !m.nexusId) return '';
  return 'https://www.nexusmods.com/' + encodeURIComponent(d) + '/mods/' +
         encodeURIComponent(m.nexusId) + '?tab=files';
}

/* A direct page when the mod id is known, otherwise a search within that game. */
function nexusURL(g, m){
  const d = nexusDomain(g);
  if (!d) return '';
  if (m.nexusId) return 'https://www.nexusmods.com/' + encodeURIComponent(d) + '/mods/' + encodeURIComponent(m.nexusId);
  return 'https://www.nexusmods.com/games/' + encodeURIComponent(d) +
         '/search?keyword=' + encodeURIComponent(m.name);
}

/* =================== state =================== */
const KEY = 'loadorder:v2';
let db = { games:[], mods:[], loadouts:[] };

           confirm:null, newLoadout:false, editGame:false, pending:null,
           picking:false, picked:[], bulk:null };
let ready = false;

function load(){
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('loadorder:v1');
    const p = raw ? JSON.parse(raw) : null;
    if (p && Array.isArray(p.games)) db = { games:p.games||[], mods:p.mods||[], loadouts:p.loadouts||[] };
  } catch {}
  backfillNexus();
  ready = true;
  render();
}

/* Mods logged before Nexus links existed may still have a Nexus address sitting
   in their source or notes. Pull the mod id out of it so they link directly. */
function backfillNexus(){
  let found = 0;
  db.mods.forEach(m => {
    if (m.nexusId) return;
    const id = nexusIdFrom(m.source) || nexusIdFrom(m.notes);
    if (id){ m.nexusId = id; found++; }
  });
  if (found){
    save();
    pendingNotice = found + ' existing mod' + (found === 1 ? '' : 's') +
      ' now link straight to their Nexus page.';
  }
}
let pendingNotice = '';
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); warnEl(''); }
  catch { warnEl('That change did not save — your browser is blocking storage or is full. Everything is still on screen, but it will be lost on reload.'); }
}
function warnEl(msg){
  const w = document.getElementById('warnbox');
  if (w) w.innerHTML = msg ? '<div class="warn">' + esc(msg) + '</div>' : '';
}
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const game = id => db.games.find(g => g.id === id);
const modsOf = id => db.mods.filter(m => m.gameId === id).sort((a,b) => a.order - b.order);

    typedAs: hit && norm(hit.title) !== norm(typed) ? typed : '',
    appid: hit ? hit.appid : null,

  });

function importAll(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!p || !Array.isArray(p.games)) throw 0;
      const seen = k => new Set(db[k].map(x => x.id));
      const sg = seen('games'), sm = seen('mods'), sl = seen('loadouts');
      p.games.forEach(g => { if (!sg.has(g.id)) db.games.push(g); });
      (p.mods||[]).forEach(m => { if (!sm.has(m.id)) db.mods.push(m); });
      (p.loadouts||[]).forEach(l => { if (!sl.has(l.id)) db.loadouts.push(l); });
      save(); render();
    } catch {
      render();
      warnEl('That file is not a Load Order backup. Pick a .json file exported from this app.');
    }
  };
  r.readAsText(file);
}


/* =================== reading mods off filenames =================== */
const ARCHIVE_EXT = /\.(zip|7z|rar|tar|gz|bz2|esp|esm|esl|pak|jar|bsa|ba2|dll|exe|mod|pkg)$/i;

/* Nexus downloads arrive as  Mod Name-<modid>-<version>-<timestamp>.7z
   so the version is usually sitting right there in the filename. */
function parseModFilename(raw){
  let s = String(raw).split(/[\\/]/).pop();
  s = s.replace(ARCHIVE_EXT, '');
  s = s.replace(/\s*\(\d+\)\s*$/, '');
  s = s.replace(ARCHIVE_EXT, '');

  let version = '', nexusId = '';
  const nexus = s.match(/^(.*?)-(\d+)-([0-9][0-9A-Za-z.\-]*)-(\d{9,})$/);
  if (nexus){
    s = nexus[1];
    nexusId = nexus[2];
    version = nexus[3].replace(/-/g, '.');
  } else {
    const short = s.match(/^(.*?)-(\d+)-(\d{9,})$/);
    if (short){ s = short[1]; nexusId = short[2]; }
    else {
      const tail = s.match(/^(.*?)[\s._-]+v?(\d+(?:[._]\d+){1,3}[a-z]?)$/i);
      if (tail){ s = tail[1]; version = tail[2].replace(/_/g, '.'); }
    }
  }
  s = s.replace(/[_]+/g, ' ').replace(/\s{2,}/g, ' ')
       .replace(/^[\s\-\u2013\u2014]+|[\s\-\u2013\u2014]+$/g, '').trim();
  return { name: s || String(raw), version, nexusId };
}

/* Folders count too — mod managers keep one folder per mod. */
function namesFromDrop(dt){
  const out = [];
  if (dt.items && dt.items.length){
    for (const it of dt.items){
      if (it.kind !== 'file') continue;
      let entry = null;
      try { entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; } catch {}
      if (entry) out.push(entry.name);
      else { const f = it.getAsFile(); if (f) out.push(f.name); }
    }
  } else if (dt.files){
    for (const f of dt.files) out.push(f.name);
  }
  return out;
}

function stageNames(names){
  if (ui.view !== 'game' || !game(ui.gameId)){
    warnEl('Open a game first, then drop the archives onto its list.');
    return;
  }
  const existing = new Set(modsOf(ui.gameId).map(m => norm(m.name)));
  const seen = new Set();
  const pending = [];
  names.forEach(n => {
    const p = parseModFilename(n);
    const key = norm(p.name);
    if (!key || seen.has(key)) return;
    seen.add(key);
    const dupe = existing.has(key);
    pending.push({ name:p.name, version:p.version, nexusId:p.nexusId, file:n, dupe, use:!dupe });
  });
  if (!pending.length){ warnEl('Nothing usable in that drop.'); return; }
  resetUI({ pending });
  render();
  window.scrollTo({ top:document.body.scrollHeight, behavior:'smooth' });
}

function addStaged(){
  const chosen = (ui.pending || []).filter(p => p.use);
  if (!chosen.length){ resetUI(); render(); return; }
  const list = modsOf(ui.gameId);
  let order = list.length ? Math.max(...list.map(m => m.order)) + 1 : 0;
  const lo = activeLoadout();
  chosen.forEach(p => {
    const mod = { id:uid('m'), gameId:ui.gameId, name:p.name, version:p.version,
                  nexusId:p.nexusId || '', source:'', notes:'', flagged:false, order:order++ };
    db.mods.push(mod);
    if (lo) lo.modIds.push(mod.id);
  });
  resetUI();
  save(); render();
}

function stagePanel(){
  const p = ui.pending;
  const n = p.filter(x => x.use).length;
  const dupes = p.filter(x => x.dupe).length;
  return '<div class="card pad stack">' +
    '<div class="hint">' + p.length + ' file' + (p.length === 1 ? '' : 's') + ' read' +
      (dupes ? ' · <b>' + dupes + '</b> already on the list, unticked' : '') + '</div>' +
    p.map((x,i) =>
      '<label class="stagerow' + (x.use ? '' : ' skip') + '">' +
        '<input type="checkbox" data-stage="' + i + '"' + (x.use ? ' checked' : '') + '>' +
        '<span class="sname">' + esc(x.name) + '</span>' +
        (x.version ? '<span class="ver">' + esc(x.version) + '</span>' : '') +

      '</label>').join('') +
    '<div class="row">' +
      '<button class="btn" id="stageAdd">Add ' + n + ' mod' + (n === 1 ? '' : 's') + '</button>' +
      '<button class="btn ghost" id="stageCancel">Discard</button>' +
    '</div>' +
  '</div>';
}


/* =================== dragging the load order =================== */
let drag = null;

function startDrag(e, id){
  if (drag) return;
  const row = document.querySelector('.mod[data-mod="' + id + '"]');
  if (!row) return;
  e.preventDefault();

  const rect = row.getBoundingClientRect();
  const rows = Array.from(document.querySelectorAll('.mod[data-mod]'));

  drag = { id, row, from: rows.indexOf(row), to: rows.indexOf(row) };
  drag.offset = e.clientY - rect.top;

  // a dashed outline shows where it will land
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.height = rect.height + 'px';
  row.parentNode.insertBefore(slot, row);
  drag.slot = slot;

  // lift the row out of the flow so it can follow the pointer
  row.classList.add('lifting');
  row.style.position = 'fixed';
  row.style.width = rect.width + 'px';
  row.style.left = rect.left + 'px';
  row.style.top = rect.top + 'px';
  document.body.classList.add('reordering');

  window.addEventListener('pointermove', onDrag, { passive: false });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}

function onDrag(e){
  if (!drag) return;
  e.preventDefault();
  const y = e.clientY;
  drag.row.style.top = (y - drag.offset) + 'px';

  // which gap is the pointer nearest?
  const others = Array.from(document.querySelectorAll('.mod[data-mod]'))
                      .filter(r => r !== drag.row);
  let to = others.length;
  for (let i = 0; i < others.length; i++){
    const r = others[i].getBoundingClientRect();
    if (y < r.top + r.height / 2){ to = i; break; }
  }
  if (to !== drag.to){
    drag.to = to;
    drag.slot.parentNode.insertBefore(drag.slot, others[to] || null);
  }

  // keep scrolling when dragging past the top or bottom
  const edge = 90;
  if (y < edge) window.scrollBy(0, -16);
  else if (y > window.innerHeight - edge) window.scrollBy(0, 16);
}

function endDrag(){
  if (!drag) return;
  window.removeEventListener('pointermove', onDrag);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  document.body.classList.remove('reordering');

  const { id, from, to, slot } = drag;
  if (slot && slot.parentNode) slot.parentNode.removeChild(slot);
  drag = null;

  if (to === from) render();
  else reorder(id, to);
}

/* Drop a mod into a new position in whatever list is on screen, then renumber.
   Only the visible rows swap places, so reordering inside a loadout leaves
   mods outside that loadout where they are. */
function reorder(id, slot){
  const shown = shownMods();
  const moving = shown.find(m => m.id === id);
  if (!moving){ render(); return; }

  const rest = shown.filter(m => m.id !== id);
  const at = Math.max(0, Math.min(rest.length, slot));
  rest.splice(at, 0, moving);

  const slots = shown.map(m => m.order).sort((a, b) => a - b);
  rest.forEach((m, i) => { m.order = slots[i]; });

  save(); render();
}


/* =================== acting on several mods at once =================== */
const isPicked = id => ui.picked.indexOf(id) !== -1;
function togglePick(id){
  ui.picked = isPicked(id) ? ui.picked.filter(x => x !== id) : ui.picked.concat([id]);
  render();
}
function pickAll(){
  const shown = shownMods().map(m => m.id);
  ui.picked = ui.picked.length === shown.length ? [] : shown;
  render();
}
function endPicking(){
  ui.picking = false; ui.picked = []; ui.bulk = null;
  render();
}

function bulkAddTo(loId){
  const lo = db.loadouts.find(l => l.id === loId);
  if (!lo) return;
  ui.picked.forEach(id => { if (!lo.modIds.includes(id)) lo.modIds.push(id); });
  ui.bulk = null;
  save(); render();
}
function bulkRemoveFrom(loId){
  const lo = db.loadouts.find(l => l.id === loId);
  if (!lo) return;
  lo.modIds = lo.modIds.filter(id => !isPicked(id));
  save(); render();
}
function bulkNewLoadout(name){
  if (!name.trim()) return;
  const lo = { id:uid('l'), gameId:ui.gameId, name:name.trim(), modIds:ui.picked.slice() };
  db.loadouts.push(lo);
  ui.bulk = null; ui.picking = false; ui.picked = []; ui.loadoutId = lo.id;
  save(); render();
}
/* Send the selection to one end of the order, keeping their relative sequence. */
function bulkMove(where){
  const shown = shownMods();
  const picked = shown.filter(m => isPicked(m.id));
  const rest = shown.filter(m => !isPicked(m.id));
  if (!picked.length) return;
  const seq = where === 'top' ? picked.concat(rest) : rest.concat(picked);
  const slots = shown.map(m => m.order).sort((a,b) => a - b);
  seq.forEach((m, i) => { m.order = slots[i]; });
  save(); render();
}
function bulkFlag(on){
  db.mods.forEach(m => { if (isPicked(m.id)) m.flagged = on; });
  save(); render();
}
function bulkDelete(){
  db.mods = db.mods.filter(m => !isPicked(m.id));
  db.loadouts.forEach(l => { l.modIds = l.modIds.filter(id => !isPicked(id)); });
  ui.picking = false; ui.picked = []; ui.bulk = null;
  save(); render();
}


/* Browsers only allow one new tab per click, so the rest usually get stopped.
   Open what we can, then hand over whatever was blocked. */
function openMany(items){
  const blocked = [];
  items.forEach((it, i) => {
    setTimeout(() => {
      let w = null;
      try { w = window.open(it.url, '_blank'); } catch {}
      if (w){ try { w.opener = null; } catch {} }
      else blocked.push(it);
      if (i === items.length - 1){
        ui.blocked = blocked.length ? blocked : null;
        if (blocked.length) render();
      }
    }, i * 260);
  });
}

/* Sandboxed previews silently block links that open a new tab. Try the normal
   way; when it's blocked, hand the address over to copy instead. */
function openOut(url){
  let w = null;
  try { w = window.open(url, '_blank'); } catch {}
  if (w){ try { w.opener = null; } catch {} return; }
  const box = document.getElementById('warnbox');
  if (!box) return;
  box.innerHTML = '<div class="notice" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
    '<span style="flex:1;min-width:170px">This preview blocks new tabs — copy the link instead. On your site it opens normally.</span>' +
    '<input type="text" readonly id="outUrl" style="flex:2;min-width:210px" value="' + esc(url) + '">' +
    '<button class="btn small" id="outCopy">Copy</button></div>';
  const inp = document.getElementById('outUrl');
  inp.focus(); inp.select();
  document.getElementById('outCopy').onclick = () => {
    inp.select();
    try { document.execCommand('copy'); } catch {}
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
    document.getElementById('outCopy').textContent = 'Copied';
  };
  box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* =================== wiring =================== */
function on(id, fn){ const el = document.getElementById(id); if (el) el.onclick = fn; }
function each(attr, fn){
  document.querySelectorAll('[data-' + attr + ']').forEach(el => {
    el.onclick = () => fn(el.getAttribute('data-' + attr));
  });
}
function vals(){
  return { name:document.getElementById('fName').value, version:document.getElementById('fVer').value,
           source:document.getElementById('fSrc').value, notes:document.getElementById('fNotes').value };
}

/* cover art: walk the URL chain, then let the generated cover show through */
function hookImages(){
  document.querySelectorAll('img[data-chain]').forEach(img => {
    img.onerror = () => {
      let chain; try { chain = JSON.parse(img.getAttribute('data-chain')); } catch { chain = []; }
      const next = Number(img.getAttribute('data-step')) + 1;
      if (next < chain.length){ img.setAttribute('data-step', next); img.src = chain[next]; }
      else img.remove();
    };
  });
}

function wire(){
  /* shelf */
  if (pendingNotice) setTimeout(() => { pendingNotice = ''; }, 100);
  on('gAdd', () => addGame(document.getElementById('gTitle').value, document.getElementById('gPlat').value));
  const gt = document.getElementById('gTitle');
  if (gt){
    gt.onkeydown = e => { if (e.key === 'Enter') document.getElementById('gAdd').click(); };
    gt.oninput = () => {
      const hit = resolveGame(gt.value);
      const echo = document.getElementById('gEcho');
      echo.innerHTML = !gt.value.trim()
        ? ''
        : hit ? 'Adds as <b>' + esc(hit.title) + '</b>'
              : 'Not in the catalog — adds as <b>' + esc(gt.value.trim()) + '</b>';
    };
  }
  each('open', id => { resetUI({ view:'game', gameId:id, loadoutId:null }); render(); window.scrollTo(0,0); });

  /* game header */
  on('back', () => { ui.picking = false; ui.picked = []; ui.bulk = null;
    resetUI({ view:'shelf', gameId:null, loadoutId:null }); render(); });
  on('egOpen', () => { resetUI({ editGame:true }); render(); });
  on('egCancel', () => { resetUI(); render(); });
  on('egSave', () => editGame(document.getElementById('egTitle').value,
     document.getElementById('egPlat').value, document.getElementById('egPoster').value,
     document.getElementById('egNexus').value));
  on('gDel', () => { resetUI({ confirm:{ type:'game', id:ui.gameId } }); render(); window.scrollTo(0,0); });

  /* loadouts */
  each('lo', id => { ui.picking = false; ui.picked = []; ui.bulk = null;
    resetUI({ loadoutId:id || null }); render(); });
  on('loAdd', () => { resetUI({ newLoadout:true }); render();
    const f = document.getElementById('loName'); if (f) f.focus(); });
  on('loCancel', () => { resetUI(); render(); });
  on('loSave', () => addLoadout(document.getElementById('loName').value));
  const ln = document.getElementById('loName');
  if (ln) ln.onkeydown = e => { if (e.key === 'Enter') document.getElementById('loSave').click(); };
  each('lodel', id => { resetUI({ confirm:{ type:'loadout', id } }); render(); });

  /* mods */
  each('incl', id => toggleInLoadout(id));
  document.querySelectorAll('[data-grip]').forEach(el => {
    el.addEventListener('pointerdown', e => startDrag(e, el.getAttribute('data-grip')));
  });

  /* outbound links: Nexus buttons and source links */
  document.querySelectorAll('a.nx, a.src, a.dl, a.linkrow').forEach(a => {
    a.onclick = e => { e.preventDefault(); openOut(a.getAttribute('href')); };
  });

  /* selecting several at once */
  on('pickMode', () => {
    if (ui.picking) endPicking();
    else { resetUI({ }); ui.picking = true; ui.picked = []; ui.bulk = null; render(); }
  });
  each('nxset', () => { resetUI({ editGame:true }); render();
    const f = document.getElementById('egNexus');
    if (f){ f.focus(); f.scrollIntoView({ block:'center', behavior:'smooth' }); } });
  each('pick', id => togglePick(id));
  on('bAll', pickAll);
  on('bDone', endPicking);
  on('bOpen', () => { ui.bulk = 'links'; ui.blocked = null; render(); });
  on('bOpenAll', () => {
    const g = game(ui.gameId);
    const items = shownMods().filter(m => isPicked(m.id))
      .map(m => ({ name:m.name, url:nexusURL(g, m) })).filter(x => x.url);
    ui.blocked = null;
    openMany(items);
  });
  on('bCopyAll', () => {
    const g = game(ui.gameId);
    const text = shownMods().filter(m => isPicked(m.id))
      .map(m => { const u = nexusURL(g, m); return u ? m.name + ' — ' + u : ''; })
      .filter(Boolean).join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    const b = document.getElementById('bCopyAll');
    if (b) b.textContent = 'Copied';
  });
  on('bTo', () => { ui.bulk = 'to'; render(); });
  on('bNew', () => { ui.bulk = 'new'; render();
    const f = document.getElementById('bLoName'); if (f) f.focus(); });
  on('bCancel', () => { ui.bulk = null; ui.blocked = null; render(); });
  each('bto', id => bulkAddTo(id));
  on('bLoSave', () => bulkNewLoadout(document.getElementById('bLoName').value));
  const bln = document.getElementById('bLoName');
  if (bln) bln.onkeydown = e => { if (e.key === 'Enter') document.getElementById('bLoSave').click(); };
  on('bOut', () => { const lo = activeLoadout(); if (lo) bulkRemoveFrom(lo.id); });
  on('bTop', () => bulkMove('top'));
  on('bBot', () => bulkMove('bottom'));
  on('bFlag', () => bulkFlag(true));
  on('bUnflag', () => bulkFlag(false));
  on('bDel', () => { ui.bulk = 'delete'; render(); });
  on('bDelYes', bulkDelete);
  each('flag', id => toggleFlag(id));
  each('edit', id => { resetUI({ editing:id }); render(); });
  each('del', id => { resetUI({ confirm:{ type:'mod', id } }); render(); });

  /* confirm strips */
  on('cNo', () => { resetUI(); render(); });
  on('cYes', () => {
    const c = ui.confirm;
    if (!c) return;
    if (c.type === 'mod') deleteMod(c.id);
    else if (c.type === 'game') deleteGame(c.id);
    else if (c.type === 'loadout') deleteLoadout(c.id);
  });

  /* mod form */
  on('modOpen', () => { resetUI({ adding:true }); render();
    const f = document.getElementById('fName'); if (f) f.focus(); });
  on('fCancel', () => { resetUI(); render(); });
  on('fSave', () => { const v = vals(); if (ui.editing) updateMod(ui.editing, v); else addMod(v); });

  /* dropping in archives */
  on('modPick', () => document.getElementById('modFiles').click());
  on('stageAdd', addStaged);
  on('stageCancel', () => { resetUI(); render(); });
  each('stage', i => {
    const p = ui.pending && ui.pending[Number(i)];
    if (p){ p.use = !p.use; render(); }
  });

  /* backup */
  on('exp', exportAll);
  on('imp', () => document.getElementById('fileIn').click());
}

/* drag state: dragenter/dragleave fire per element, so count them */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragover', e => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault();
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove('dragging');
});
window.addEventListener('drop', e => {
  if (!e.dataTransfer) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const names = namesFromDrop(e.dataTransfer);
  if (names.length) stageNames(names);
});
document.getElementById('modFiles').addEventListener('change', e => {
  const names = Array.from(e.target.files || []).map(f => f.name);
  e.target.value = '';
  if (names.length) stageNames(names);
});

document.getElementById('fileIn').addEventListener('change', e => {
  if (e.target.files[0]) importAll(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('titles').innerHTML =
  CATALOG.map(([t]) => '<option value="' + esc(t) + '">').join('');

load();
</script>
